trigger:
- main

# =========================================================
# STAGES
# =========================================================
stages:

# =========================================================
# STAGE 1 : BUILD
# =========================================================
- stage: Build
  displayName: 'Build Stage'

  jobs:
  - job: BuildJob
    displayName: 'Build using Apache Ant'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # Checkout Code
    - checkout: self
      fetchDepth: 0

    # Install JDK 21
    - task: JavaToolInstaller@0
      displayName: 'Install JDK 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # Verify Java
    - script: |
        java -version
        javac -version
      displayName: 'Verify Java Version'

    # Build using Ant
    - task: Ant@1
      displayName: 'Build Project using Ant'
      inputs:
        buildFile: 'build.xml'
        targets: 'clean compile jar'

    # Debug generated files
    - script: |
        echo "===== GENERATED FILES ====="
        pwd
        ls -R
      displayName: 'Check Build Output'

    # Publish Artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact'
      inputs:
        targetPath: 'dist'
        artifact: 'JavaApp'

# =========================================================
# STAGE 2 : SONARCLOUD ANALYSIS
# =========================================================
- stage: CodeQuality
  displayName: 'SonarCloud Analysis'

  dependsOn: Build

  jobs:
  - job: SonarJob

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self
      fetchDepth: 0

    # Install JDK 21
    - task: JavaToolInstaller@0
      displayName: 'Install JDK 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # Prepare SonarCloud
    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'SonarCloud-ServiceConnection'
        organization: 'ad8551321'

        scannerMode: 'CLI'
        configMode: 'manual'

        cliProjectKey: 'ad8551321_Quiz-application'
        cliProjectName: 'Quiz-Application'

        cliSources: 'src'

        extraProperties: |
          sonar.java.binaries=build/classes

    # Run Ant Build
    - task: Ant@1
      displayName: 'Run Ant Build'
      inputs:
        buildFile: 'build.xml'
        targets: 'clean compile'

    # Run Sonar Analysis
    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'

    # Publish Sonar Result
    - task: SonarCloudPublish@3
      displayName: 'Publish Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

# =========================================================
# STAGE 3 : DEPLOYMENT
# =========================================================
- stage: Deploy
  displayName: 'Production Deployment'

  dependsOn: CodeQuality

  jobs:

  - deployment: DeployToProduction
    displayName: 'Deploy Application'

    environment: 'Production'

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          # Download Artifact
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Artifact'
            inputs:
              artifact: 'JavaApp'
              path: '$(Pipeline.Workspace)/artifacts'

          # Verify Artifact
          - script: |
              echo "===== DOWNLOADED ARTIFACT ====="
              ls -R $(Pipeline.Workspace)/artifacts
            displayName: 'Verify Artifact'

          # Deployment
          - script: |
              echo "Deployment Started"
              echo "Deploying Application..."
              echo "Deployment Successful"
            displayName: 'Deploy Application'