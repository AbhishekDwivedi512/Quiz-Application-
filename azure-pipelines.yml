trigger:
- main

# =========================================================
# STAGE 1 : BUILD
# =========================================================
stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:
  - job: BuildJob
    displayName: 'Build using Apache Ant'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # Checkout Code
    - checkout: self

    # Install JDK 21
    - task: JavaToolInstaller@0
      displayName: 'Install JDK 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # Verify Java Version
    - script: |
        java -version
        javac -version
      displayName: 'Verify Java Version'

    # Debug Repository Structure
    - script: |
        echo "Repository Structure"
        pwd
        ls -R
      displayName: 'Debug Repository'

    # Build using Apache Ant
    - task: Ant@1
      displayName: 'Build Project using Ant'
      inputs:
        buildFile: 'build.xml'
        targets: 'clean compile jar' 

# =========================================================
# STAGE 2 : SONARCLOUD ANALYSIS
# =========================================================
- stage: CodeQuality
  displayName: 'SonarCloud Analysis'

  dependsOn: Build

  jobs:
  - job: SonarJob

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    # Install JDK 21
    - task: JavaToolInstaller@0
      displayName: 'Install JDK 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # Prepare SonarCloud
    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'SonarCloud-ServiceConnection'
        organization: 'ad8551321'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'ad8551321_Quiz-application'
        cliProjectName: 'Quiz-Application'
        cliSources: '.'

    # Run Ant Build Again
    - task: Ant@1
      displayName: 'Run Ant Build'
      inputs:
        buildFile: 'build.xml'
        targets: 'clean compile'

    # Analyze
    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'

    # Publish Result
    - task: SonarCloudPublish@3
      displayName: 'Publish Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

# =========================================================
# STAGE 3 : DEPLOYMENT
# =========================================================
- stage: Deploy
  displayName: 'Production Deployment'

  dependsOn: CodeQuality

  jobs:

  - deployment: DeployToProduction
    displayName: 'Deploy Application'

    environment: 'Production'

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - script: |
              echo "Deployment Started"
              echo "Deploying Application..."
              echo "Deployment Successful"
            displayName: 'Deploy Application'